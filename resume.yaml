# Single source of truth for the résumé — keep EVERY role, project and detail here,
# even the ones that don't fit the one-page PDF. Each role has a `detail` flag:
#   detail: "full"     -> company header + bullets (default)
#   detail: "compact"  -> single line, bullets kept in the file but not rendered
# Flip a role to "full" when you have room; nothing is deleted.
# A role may also carry an optional `story`: a list of quoted paragraphs holding
# the longer narrative behind it. `story` is reference-only — the PDF and the
# website do not render it for now.
# Then export the PDF from resume.typ in the Typst web app and run: python3 build_web.py
# Supported subset: quoted scalars, lists of mappings, and nested "- " lists.

